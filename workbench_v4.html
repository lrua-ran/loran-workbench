<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Loran · 工作台</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2EBDE">
<link rel="manifest" href="data:application/json,{}">
<style>
:root{
  --bg:           #F2EBDE;
  --bg-deep:      #E8DECC;
  --paper:        #FBF7EE;
  --paper-edge:   #F0E8D6;
  --ink:          #2A2419;
  --ink-soft:     #5C5246;
  --ink-faint:    #9A8F7C;
  --rule:         #DDD2BB;
  --gold:         #B08A4E;
  --gold-soft:    #C9A878;
  --gold-glow:    rgba(176,138,78,.18);
  --vermilion:    #B84A38;
  --jade:         #5C7A5A;
  --shadow:       0 2px 8px rgba(90,70,40,.06), 0 12px 32px rgba(90,70,40,.04);
  --shadow-hover: 0 6px 20px rgba(90,70,40,.10), 0 16px 40px rgba(90,70,40,.06);
  --sidebar-w:    320px;
  --radius:       14px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC",-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
  font-size:14px;
  line-height:1.7;
  letter-spacing:.02em;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
.serif{font-family:"Noto Serif SC","Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:.04em}

/* ===== 布局 ===== */
.app{min-height:100vh;display:flex}

/* ===== Toast ===== */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  padding:12px 28px;border-radius:28px;
  font-size:13px;letter-spacing:.06em;z-index:3000;
  opacity:0;transition:opacity .35s,transform .35s;
  pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 16px rgba(42,36,25,.25);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
.toast.warn{background:var(--vermilion)}
.toast.ok{background:var(--jade)}

/* ===== 侧边栏（桌面常驻 / 移动抽屉） ===== */
.sidebar{
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  background:var(--bg-deep);
  border-right:1px solid var(--rule);
  padding:32px 0 24px;
  display:flex;flex-direction:column;
  position:relative;z-index:1000;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(176,138,78,.05) 0, transparent 30%),
    radial-gradient(circle at 80% 90%, rgba(176,138,78,.06) 0, transparent 30%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}

/* 移动：抽屉式 */
@media(max-width:860px){
  .sidebar{
    position:fixed;top:0;left:0;bottom:0;
    transform:translateX(-100%);
    box-shadow:4px 0 24px rgba(90,70,40,.15);
    width:80vw;min-width:0;max-width:360px;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{
    position:fixed;inset:0;
    background:rgba(42,36,25,.35);
    backdrop-filter:blur(2px);
    z-index:990;
    opacity:0;pointer-events:none;
    transition:opacity .3s;
  }
  .sidebar-overlay.show{opacity:1;pointer-events:auto}
}

.sidebar-close{
  position:absolute;top:16px;right:16px;
  width:30px;height:30px;border-radius:50%;
  background:transparent;border:1px solid var(--rule);
  display:none;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-soft);font-size:16px;
  transition:all .25s;z-index:10;
}
@media(max-width:860px){.sidebar-close{display:flex}}
.sidebar-close:active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold)}

.sidebar-toggle{
  display:none;
  width:40px;height:40px;border-radius:50%;
  background:var(--paper);border:1px solid var(--rule);
  align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-soft);flex-shrink:0;
  transition:all .25s;
}
@media(max-width:860px){.sidebar-toggle{display:flex}}
.sidebar-toggle:active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold)}
.sidebar-toggle .bars{display:flex;flex-direction:column;gap:4px}
.sidebar-toggle .bars span{display:block;width:18px;height:1.5px;background:currentColor;border-radius:1px}
.sidebar-toggle.has-badge::after{
  content:"";position:absolute;top:-1px;right:-1px;
  width:8px;height:8px;border-radius:50%;
  background:var(--vermilion);box-shadow:0 0 0 2px var(--bg);
}

.brand{padding:0 28px 28px;border-bottom:1px solid var(--rule)}
.brand-mark{display:flex;align-items:center;gap:12px}
.brand-seal{
  width:38px;height:38px;border-radius:50%;
  background:var(--vermilion);
  display:flex;align-items:center;justify-content:center;
  color:#FBF7EE;font-family:"Noto Serif SC",serif;font-weight:600;font-size:18px;
  box-shadow:0 2px 6px rgba(184,74,56,.3);
}
.brand-name{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:.12em}
.brand-sub{font-size:11px;color:var(--ink-faint);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}

.nav{margin-top:20px;flex:1;overflow-y:auto}
.nav-section{padding:0 18px}
.nav-label{font-size:10px;letter-spacing:.3em;color:var(--ink-faint);padding:14px 12px 10px;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;margin-bottom:2px;
  border-radius:8px;cursor:pointer;
  color:var(--ink-soft);transition:all .2s;position:relative;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.nav-item:hover{background:rgba(176,138,78,.08);color:var(--ink)}
.nav-item:active{background:rgba(176,138,78,.15)}
.nav-item.active{background:rgba(176,138,78,.12);color:var(--ink);font-weight:500}
.nav-item.active::before{content:"";position:absolute;left:-18px;top:8px;bottom:8px;width:2px;background:var(--gold)}
.nav-icon{font-size:15px;width:22px;text-align:center}
.nav-text{flex:1;font-size:14px;letter-spacing:.06em}
.nav-kbd{
  font-family:"Cormorant Garamond",serif;
  font-size:10px;color:var(--ink-faint);
  background:var(--bg);padding:1px 5px;border-radius:3px;border:1px solid var(--rule);
  opacity:.6;
}
.nav-item.active .nav-kbd{color:var(--gold-soft);border-color:var(--gold-soft);opacity:1}

/* 同步区 */
.sync-section{
  margin-top:12px;padding:16px 18px 0;
  border-top:1px dashed var(--rule);
}
.sync-label{font-size:10px;letter-spacing:.3em;color:var(--ink-faint);padding:0 12px 10px;text-transform:uppercase}
.sync-btns{display:flex;gap:8px;padding:0 12px}
.sync-btn{
  flex:1;padding:8px 0;border:1px solid var(--rule);
  border-radius:8px;background:transparent;
  font-size:12px;color:var(--ink-soft);
  cursor:pointer;letter-spacing:.08em;
  transition:all .2s;font-family:inherit;
  text-align:center;
}
.sync-btn:active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold)}

.sidebar-foot{
  padding:16px 28px 0;border-top:1px solid var(--rule);
  font-size:11px;color:var(--ink-faint);
  display:flex;justify-content:space-between;align-items:center;
}
.live-dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--jade);margin-right:5px;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(92,122,90,.5)}
  70%{box-shadow:0 0 0 5px rgba(92,122,90,0)}
  to{box-shadow:0 0 0 0 rgba(92,122,90,0)}
}

/* ===== 主区 ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 32px;
  border-bottom:1px solid var(--rule);
  background:var(--bg);gap:14px;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0}
.topbar-titles{min-width:0}
.crumb{font-size:11px;color:var(--ink-faint);letter-spacing:.18em;margin-bottom:4px;text-transform:uppercase}
.page-title{
  font-family:"Noto Serif SC",serif;
  font-size:22px;font-weight:500;
  color:var(--ink);letter-spacing:.06em;
}
.page-title::before{
  content:"";display:inline-block;width:4px;height:18px;
  background:linear-gradient(180deg,var(--gold),var(--gold-soft));
  margin-right:8px;border-radius:2px;vertical-align:middle;
}
.page-meta{font-size:12px;color:var(--ink-faint);font-family:"Cormorant Garamond",serif;letter-spacing:.12em}

.top-actions{display:flex;gap:10px;align-items:center}
.btn-ghost{
  background:transparent;border:1px solid var(--rule);
  color:var(--ink-soft);padding:6px 14px;border-radius:20px;
  font-size:12px;letter-spacing:.08em;cursor:pointer;
  transition:all .2s;font-family:inherit;
  white-space:nowrap;
}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-ghost:active{background:var(--gold-glow)}
.btn-icon{
  width:34px;height:34px;border-radius:50%;
  background:var(--paper);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink-soft);font-size:16px;
  transition:all .25s;
}
.btn-icon:active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold)}
.btn-icon.spin{animation:spin .8s linear}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== 内容 ===== */
.content{padding:28px 32px 48px;flex:1;overflow-y:auto}
.container{max-width:800px;margin:0 auto}

/* ===== 卡片 ===== */
.card{
  background:var(--paper);
  border:1px solid var(--paper-edge);
  border-radius:var(--radius);
  padding:24px 28px;margin-bottom:18px;
  box-shadow:var(--shadow);
}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{
  font-family:"Noto Serif SC",serif;
  font-size:15px;font-weight:500;color:var(--ink);letter-spacing:.06em;
  display:flex;align-items:center;gap:8px;
}
.card-title::before{content:"";display:inline-block;width:5px;height:5px;background:var(--vermilion);border-radius:50%}
.card-tag{font-size:10px;letter-spacing:.18em;color:var(--ink-faint);padding:2px 10px;border:1px solid var(--rule);border-radius:10px;text-transform:uppercase}

/* ===== 1. 晨间汇总 ===== */
.morning-hero{
  background:linear-gradient(135deg, #F8F2E4 0%, #EFE5D2 100%);
  border-radius:18px;padding:36px 40px;margin-bottom:20px;
  position:relative;overflow:hidden;
  border:1px solid var(--paper-edge);
}
.morning-hero::before{
  content:"朝";position:absolute;right:20px;top:12px;
  font-family:"Noto Serif SC",serif;font-size:120px;
  color:rgba(176,138,78,.07);font-weight:600;line-height:1;
}
.morning-date{
  font-family:"Cormorant Garamond",serif;
  font-size:12px;letter-spacing:.32em;color:var(--gold);
  text-transform:uppercase;margin-bottom:12px;
}
.morning-greeting{
  font-family:"Noto Serif SC",serif;
  font-size:30px;font-weight:500;color:var(--ink);
  letter-spacing:.06em;margin-bottom:6px;
}
.morning-poem{
  font-family:"Noto Serif SC",serif;
  font-size:13px;color:var(--ink-soft);letter-spacing:.1em;
}
.morning-stats{display:flex;gap:32px;margin-top:20px;padding-top:18px;border-top:1px solid rgba(176,138,78,.2);flex-wrap:wrap}
.mstat-num{
  font-family:"Cormorant Garamond",serif;
  font-size:26px;font-weight:600;color:var(--ink);letter-spacing:.02em;
}
.mstat-lbl{font-size:10px;color:var(--ink-faint);letter-spacing:.18em;text-transform:uppercase;margin-top:3px}

.news-list{display:flex;flex-direction:column;gap:12px}
.news-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px dashed var(--rule)}
.news-item:last-child{border:none}
.news-rank{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:500;color:var(--gold);line-height:1;min-width:36px}
.news-rank.top3{color:var(--vermilion)}
.news-body{flex:1;min-width:0}
.news-title{
  font-family:"Noto Serif SC",serif;font-size:15px;font-weight:500;color:var(--ink);
  text-decoration:none;letter-spacing:.04em;display:inline-block;margin-bottom:4px;
}
.news-summary{font-size:12px;color:var(--ink-soft);line-height:1.65}
.news-meta{display:flex;gap:10px;margin-top:6px;font-size:10px;color:var(--ink-faint);letter-spacing:.08em;flex-wrap:wrap}
.news-source{color:var(--gold)}

/* ===== 2. 英语学习 ===== */
.en-hero{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.en-stat{
  background:var(--paper);border:1px solid var(--paper-edge);
  border-radius:var(--radius);padding:22px;text-align:center;box-shadow:var(--shadow);
}
.en-stat-num{font-family:"Cormorant Garamond",serif;font-size:42px;font-weight:600;color:var(--gold);line-height:1}
.en-stat-lbl{font-size:10px;color:var(--ink-faint);letter-spacing:.2em;margin-top:8px;text-transform:uppercase}

.scene-card{
  background:var(--paper);border:1px solid var(--paper-edge);
  border-radius:var(--radius);padding:20px 24px;margin-bottom:14px;box-shadow:var(--shadow);
}
.scene-ctx{
  display:inline-block;font-size:10px;letter-spacing:.18em;color:var(--gold);
  background:var(--gold-glow);padding:2px 10px;border-radius:10px;margin-bottom:12px;
}
.dialogue{margin-bottom:12px}
.d-line{display:flex;gap:12px;margin-bottom:6px;align-items:flex-start}
.d-role{font-size:10px;color:var(--gold);letter-spacing:.12em;min-width:44px;font-weight:500;padding-top:3px}
.d-text{font-size:14px;color:var(--ink);line-height:1.65}
.d-hint{font-size:11px;color:var(--ink-faint);margin-top:2px;font-style:italic}

.score-row{display:flex;gap:10px;align-items:center;padding-top:12px;border-top:1px dashed var(--rule)}
.score-bar{flex:1;height:5px;background:var(--bg-deep);border-radius:3px;overflow:hidden}
.score-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:3px;transition:width .5s}
.score-num{font-family:"Cormorant Garamond",serif;font-size:16px;color:var(--gold);font-weight:600}

/* ===== 3. 深度学习 ===== */
.learn-card{
  background:linear-gradient(135deg, var(--paper) 0%, #F5EDD9 100%);
  border:1px solid var(--paper-edge);
  border-radius:16px;padding:32px 36px;box-shadow:var(--shadow);
}
.learn-domain{
  display:inline-block;font-family:"Noto Serif SC",serif;
  font-size:12px;letter-spacing:.18em;color:var(--vermilion);
  background:rgba(184,74,56,.08);padding:3px 12px;border-radius:12px;margin-bottom:16px;
}
.learn-theory{
  font-family:"Noto Serif SC",serif;font-size:20px;font-weight:500;
  color:var(--ink);line-height:1.5;letter-spacing:.04em;margin-bottom:18px;
  padding-left:16px;border-left:3px solid var(--gold);
}
.learn-case-label{font-size:10px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px}
.learn-case{
  font-size:13px;color:var(--ink-soft);line-height:1.8;margin-bottom:18px;
  padding:12px 16px;background:rgba(255,255,255,.5);
  border-radius:8px;border:1px solid var(--paper-edge);
}
.learn-q{
  font-family:"Noto Serif SC",serif;
  font-size:15px;color:var(--ink);
  padding:14px 18px;background:rgba(176,138,78,.06);
  border-radius:8px;border-left:3px solid var(--vermilion);letter-spacing:.04em;
}
.learn-q::before{content:"问：";color:var(--vermilion);font-weight:600;margin-right:4px}

.learn-cycle{display:flex;gap:6px;margin-bottom:18px;justify-content:center;flex-wrap:wrap}
.cycle-dot{
  padding:5px 12px;border-radius:12px;font-size:11px;color:var(--ink-faint);
  border:1px solid var(--rule);background:var(--paper);letter-spacing:.1em;cursor:pointer;
  transition:all .2s;
}
.cycle-dot:active{background:var(--gold-glow)}
.cycle-dot.active{background:var(--gold);color:var(--paper);border-color:var(--gold)}

/* ===== 4. 财务 ===== */
.fin-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.fin-card{
  background:var(--paper);border:1px solid var(--paper-edge);
  border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);
}
.fin-lbl{font-size:10px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px}
.fin-num{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1.1}
.fin-num.up{color:var(--vermilion)}
.fin-num.dn{color:var(--jade)}
.fin-sub{font-size:10px;color:var(--ink-faint);margin-top:5px;letter-spacing:.1em}

.budget-bar{height:6px;background:var(--bg-deep);border-radius:3px;overflow:hidden;margin-top:12px}
.budget-fill{height:100%;background:linear-gradient(90deg,var(--jade),var(--gold));border-radius:3px;transition:width .6s}
.budget-warn .budget-fill{background:linear-gradient(90deg,var(--gold),var(--vermilion))}

.fund-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px dashed var(--rule)}
.fund-name{font-family:"Noto Serif SC",serif;font-size:13px;color:var(--ink);font-weight:500}
.fund-code{font-size:10px;color:var(--ink-faint);margin-left:6px}
.fund-info{display:flex;flex-direction:column}
.fund-sub{font-size:10px;color:var(--ink-faint);margin-top:3px;letter-spacing:.08em}
.fund-val{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600}
.fund-val.up{color:var(--vermilion)}
.fund-val.dn{color:var(--jade)}

.tx-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px dashed var(--rule)}
.tx-info{display:flex;align-items:center;gap:12px}
.tx-cat{
  width:32px;height:32px;border-radius:50%;background:var(--gold-glow);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.tx-name{font-size:13px;color:var(--ink)}
.tx-date{font-size:10px;color:var(--ink-faint);margin-top:1px}
.tx-amt{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600}
.tx-amt.in{color:var(--vermilion)}
.tx-amt.out{color:var(--ink-soft)}

/* ===== 5. 收藏 ===== */
.collect-item{padding:16px 0;border-bottom:1px dashed var(--rule)}
.collect-cat{display:inline-block;font-size:10px;letter-spacing:.16em;padding:2px 8px;border-radius:8px;margin-bottom:6px}
.collect-cat.idea{background:rgba(176,138,78,.12);color:var(--gold)}
.collect-cat.skill{background:rgba(92,122,90,.15);color:var(--jade)}
.collect-cat.fun{background:rgba(184,74,56,.12);color:var(--vermilion)}
.collect-title{font-family:"Noto Serif SC",serif;font-size:14px;color:var(--ink);font-weight:500;margin:4px 0 6px;letter-spacing:.04em}
.collect-ai{font-size:12px;color:var(--ink-soft);line-height:1.7;padding-left:10px;border-left:2px solid var(--gold-soft)}
.collect-date{font-size:10px;color:var(--ink-faint);letter-spacing:.1em;margin-top:6px}

/* ===== 6. 阅读 ===== */
.book-current{
  display:flex;gap:20px;align-items:center;
  background:linear-gradient(135deg, var(--paper) 0%, #F5EDD9 100%);
  border:1px solid var(--paper-edge);
  border-radius:16px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:18px;
}
.book-cover{
  width:56px;height:78px;background:linear-gradient(180deg,var(--vermilion),#8B3527);
  border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",serif;color:var(--paper);
  font-size:20px;font-weight:600;writing-mode:vertical-rl;letter-spacing:.14em;
  box-shadow:0 3px 10px rgba(184,74,56,.3);flex-shrink:0;
}
.book-info{flex:1;min-width:0}
.book-title{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--ink);margin-bottom:2px;font-weight:500}
.book-author{font-size:11px;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:12px}
.book-progress{display:flex;align-items:center;gap:12px}
.book-bar{flex:1;height:5px;background:var(--bg-deep);border-radius:3px;overflow:hidden}
.book-fill{height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:3px}
.book-pct{font-family:"Cormorant Garamond",serif;font-size:13px;color:var(--gold);font-weight:600}
.book-note{

.quote-card{

  border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);margin-bottom:12px;position:relative;
}
.quote-card::before{
  content:"「";position:absolute;left:12px;top:4px;

}
.quote-body{font-family:"Noto Serif SC",serif;font-size:15px;color:var(--ink);letter-spacing:.06em;line-height:1.75;padding-left:22px}
.quote-src{text-align:right;font-size:10px;color:var(--ink-faint);letter-spacing:.16em;margin-top:8px}

/* ===== 7. 诗词 ===== */
.poem-card{

}

.poem-ctx{font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:6px;display:inline-block;background:var(--gold-glow);padding:2px 8px;border-radius:8px}

/* ===== 8. 待办 ===== */
.todo-input{display:flex;gap:8px;margin-bottom:18px}
.todo-input input{
  flex:1;background:var(--paper);border:1px solid var(--paper-edge);
  padding:10px 16px;border-radius:22px;font-size:13px;color:var(--ink);
  outline:none;font-family:inherit;letter-spacing:.04em;
}
.todo-input input:focus{border-color:var(--gold-soft)}
.todo-input button{
  background:var(--gold);color:var(--paper);border:none;
  padding:0 20px;border-radius:22px;cursor:pointer;
  font-size:12px;letter-spacing:.1em;font-family:inherit;
  transition:opacity .2s;white-space:nowrap;
}
.todo-input button:active{opacity:.8}

.todo-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--rule)}
.todo-row.done{opacity:.4}
.todo-row.done .todo-text{text-decoration:line-through}
.todo-check{
  width:20px;height:20px;border:1.5px solid var(--rule);
  border-radius:50%;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.todo-row.done .todo-check{background:var(--jade);border-color:var(--jade)}
.todo-row.done .todo-check::after{content:"✓";color:var(--paper);font-size:10px;font-weight:600}
.todo-text{flex:1;font-size:13px;color:var(--ink);letter-spacing:.04em;word-break:break-all}
.todo-meta{font-size:10px;color:var(--ink-faint);letter-spacing:.1em;white-space:nowrap}
.todo-del{background:transparent;border:none;cursor:pointer;color:var(--ink-faint);font-size:16px;opacity:0;transition:opacity .15s;padding:4px}
.todo-row:hover .todo-del,.todo-row:active .todo-del{opacity:1}

/* ===== 导入/导出弹窗 ===== */
.modal{
  position:fixed;inset:0;z-index:2000;

.modal.show{opacity:1;pointer-events:auto}
.modal-bg{position:absolute;inset:0;background:rgba(42,36,25,.45);backdrop-filter:blur(3px)}

.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

<script>

const ls = {

const today = ()=>{
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* Toast */
let _toastTimer;
function toast(msg,type=''){
  const el=$('#toast');el.textContent=msg;el.className='toast show '+type;
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),2200);
}

/* 剪贴板 */
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);toast('已复制到剪贴板 ✓','ok')}
  catch(e){
    const ta=document.createElement('textarea');ta.value=txt;
    document.body.appendChild(ta);ta.select();
    document.execCommand('copy');document.body.removeChild(ta);
    toast('已复制 ✓','ok');
  }
}

/* ============ 默认数据 ============ */

/* ============ 数据层 ============ */
let data={};
function loadData(){
  data={
    jokes:ls.get('jokes',DEFAULT.jokes),
    news:ls.get('news',DEFAULT.news),
    todos:ls.get('todos',DEFAULT.todos),
    english:ls.get('english',DEFAULT.english),

function saveData(){
  Object.keys(data).forEach(k=>{
    if(k==='englishCheckedDate'||typeof data[k]==='string')ls.set(k,data[k]);
    else ls.set(k,data[k]);
  });
}

/* ============ 导入/导出 ============ */
function showExport(){
  const payload = {};
  Object.keys(data).forEach(k=>{payload[k]=data[k]});
  const b64 = btoa(encodeURIComponent(JSON.stringify(payload)));
  $('#exportData').value = 'LORAN:'+b64;
  $('#exportModal').classList.add('show');
  setTimeout(()=>$('#exportData').select(),200);
}
function closeExport(){$('#exportModal').classList.remove('show')}
async function copyExport(){
  await copyText($('#exportData').value);
  closeExport();
}

function showImport(){$('#importModal').classList.add('show')}
function closeImport(){$('#importModal').classList.remove('show')}

function doImport(){
  const raw = $('#importData').value.trim();
  if(!raw){toast('请粘贴 LORAN 数据','warn');return}
  let b64 = raw;
  if(raw.startsWith('LORAN:'))b64=raw.slice(6);
  try{
    const json = JSON.parse(decodeURIComponent(atob(b64)));
    if(typeof json!=='object'||!json.todos){toast('数据格式无效','warn');return}
    // 合并导入
    Object.keys(json).forEach(k=>{
      if(DEFAULT.hasOwnProperty(k)){data[k]=json[k];ls.set(k,json[k])}
    });
    toast('数据导入成功 ✓ 刷新中...','ok');
    closeImport();
    setTimeout(()=>go(curPage),500);
  }catch(e){
    toast('解析失败，请检查数据完整性','warn');
  }
}

const PAGES = {morning:rMorning,english:rEnglish,learn:rLearn,finance:rFinance,collect:rCollect,read:rRead,poems:rPoems,todo:rTodo};
let curPage='morning';

function go(p){
  if(!PAGES[p])return;
  curPage=p;
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===p));
  const m=PAGE_META[p];
  $('#pageTitle').textContent=m.t;
  $('#pageMeta').textContent=m.m;
  PAGES[p]();
}

/* ============ 新闻拉取 ============ */
async function fetchNews(){
  try{
    const api='https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2509&k=&num=8&page=1';
    const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(api);
    const res=await fetch(proxy);if(!res.ok)throw new Error();
    const json=await res.json();
    if(json?.result?.data){
      data.news=json.result.data.slice(0,8).map(n=>({title:n.title,summary:(n.intro||'').slice(0,40),source:n.media||'新浪',link:n.url,time:new Date(n.ctime*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}));
      saveData();if(curPage==='morning')rMorning();
    }
  }catch(e){
    // fallback: use cached
    if(data.news.length&&curPage==='morning')rMorning();
  }
}

/* ============ 侧边栏 ============ */
function openSidebar(){if(window.innerWidth<=860){$('#sidebar').classList.add('open');$('#overlay').classList.add('show')}}
function closeSidebar(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')}
function toggleSidebar(){$('#sidebar').classList.contains('open')?closeSidebar():openSidebar()}

/* ============ 启动 ============ */
function bindEvents(){
  $$('.nav-item').forEach(n=>n.onclick=()=>{go(n.dataset.page);if(window.innerWidth<860)closeSidebar()});
  $('#refreshBtn').onclick=async()=>{const b=$('#refreshBtn');b.classList.add('spin');await fetchNews();setTimeout(()=>b.classList.remove('spin'),500)};
  $('#sidebarToggle').onclick=toggleSidebar;
  $('#sidebarClose').onclick=closeSidebar;
  $('#overlay').onclick=closeSidebar;

  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    const map={1:'morning',2:'english',3:'finance',4:'learn',5:'read',6:'poems',7:'collect',8:'todo'};
    if(map[e.key]){go(map[e.key]);if(window.innerWidth<860)closeSidebar()}
    if(e.key==='Escape')closeSidebar();
    if(e.key==='m'||e.key==='M')toggleSidebar();
  });

  // 隔30秒更新时钟
  function tick(){const d=new Date();$('#liveClock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});setTimeout(tick,30000)}
  tick();
}

function init(){
  loadData();
  bindEvents();
  go('morning');
  fetchNews();
}
init();
