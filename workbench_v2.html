<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loran 的工作台 v2</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#6BA8E5;--blue-light:#EAF3FC;--blue-dark:#4A8FD0;
  --pink:#FF9EC4;--pink-light:#FFF0F6;--pink-dark:#F473A6;
  --gradient:linear-gradient(135deg,#7DB9E8 0%,#FF9EC4 100%);
  --gradient-soft:linear-gradient(135deg,#EAF3FC 0%,#FFF0F6 100%);
  --red:#E53E3E;--red-light:#FFF5F5;
  --green:#38A169;--green-light:#F0FFF4;
  --orange:#DD6B20;--orange-light:#FFFAF0;
  --purple:#805AD5;--purple-light:#F0E6FF;
  --gray-50:#F8FAFD;--gray-100:#EDF2F7;--gray-200:#E2E8F0;--gray-300:#CBD5E0;
  --gray-400:#A0AEC0;--gray-500:#718096;--gray-600:#4A5568;--gray-700:#2D3748;--gray-800:#1A202C;
  --white:#FFF;--shadow:0 2px 12px rgba(123,185,232,.12),0 1px 4px rgba(0,0,0,.04);
  --shadow-md:0 8px 24px rgba(123,185,232,.18),0 2px 8px rgba(0,0,0,.05);
  --radius:16px;--radius-sm:12px;
  --sidebar-w:210px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%}
body{font-family:var(--font);background:var(--gradient-soft);color:var(--gray-800);line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{
  width:var(--sidebar-w);min-width:var(--sidebar-w);
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-right:1px solid #F0E6EE;display:flex;flex-direction:column;
  padding:20px 0;z-index:10;overflow-y:auto;
}
.sidebar-logo{padding:0 16px 16px;border-bottom:1px solid #F5EAF1;margin-bottom:8px}
.sidebar-logo h2{font-size:18px;font-weight:800;letter-spacing:-.3px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-logo .ver{font-size:11px;color:var(--gray-400);margin-top:2px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  cursor:pointer;transition:all .2s;font-size:14px;font-weight:500;
  color:var(--gray-600);border-left:3px solid transparent;margin:2px 0;
}
.nav-item:hover{background:var(--gray-50);color:var(--gray-800)}
.nav-item.active{
  background:var(--gradient-soft);color:var(--blue-dark);
  border-left-color:var(--blue);font-weight:600;
}
.nav-item .nav-emoji{font-size:18px;width:24px;text-align:center}
.nav-item .nav-shortcut{font-size:11px;color:var(--gray-400);margin-left:auto;font-family:monospace}
.nav-item.active .nav-shortcut{color:var(--blue)}

/* Sidebar bottom section */
.sidebar-footer{
  margin-top:auto;padding:12px 16px;border-top:1px solid #F5EAF1;
  display:flex;flex-direction:column;gap:8px;
}
.sidebar-footer .btn-sm{
  font-size:12px;padding:6px 12px;border:1px solid var(--gray-200);
  border-radius:8px;background:var(--white);color:var(--gray-500);
  cursor:pointer;text-align:center;transition:all .2s;
}
.sidebar-footer .btn-sm:hover{background:var(--gray-50);color:var(--gray-700)}

/* Main */
.main{flex:1;overflow-y:auto;padding:24px 28px}
.mobile-header{display:none;padding:12px 16px;justify-content:space-between;align-items:center;background:var(--white);border-bottom:1px solid var(--gray-100)}
.mobile-header h2{font-size:16px;font-weight:700}
.mobile-menu-btn{width:36px;height:36px;border:none;background:var(--gray-100);border-radius:8px;font-size:20px;cursor:pointer}

/* Page header */
.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:800;margin-bottom:4px}
.page-header .page-sub{font-size:13px;color:var(--gray-500)}

/* Module card */
.module-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.module-card-header{
  padding:14px 18px;border-bottom:1px solid #F8F2F6;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.module-card-title{font-size:15px;font-weight:700;color:var(--gray-800);display:flex;align-items:center;gap:8px}
.module-card-body{padding:18px}

/* Compact card */
.compact-card{
  background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:12px;cursor:pointer;transition:all .2s;
}
.compact-card:hover{box-shadow:var(--shadow-md)}

/* Empty state */
.empty-state{padding:40px 20px;text-align:center;color:var(--gray-400)}
.empty-state svg{margin-bottom:8px;opacity:.5}

/* Grid */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.row2{grid-template-columns:1fr}}

/* ===== Components ===== */
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.badge.blue{background:var(--blue-light);color:var(--blue-dark)}
.badge.green{background:var(--green-light);color:var(--green)}
.badge.red{background:var(--red-light);color:var(--red)}
.badge.orange{background:var(--orange-light);color:var(--orange)}
.badge.purple{background:var(--purple-light);color:var(--purple)}

.tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.tag.blue{background:var(--blue-light);color:var(--blue-dark)}
.tag.green{background:var(--green-light);color:var(--green)}
.tag.orange{background:var(--orange-light);color:var(--orange)}
.tag.purple{background:var(--purple-light);color:var(--purple)}

/* Form elements */
input,textarea,select{
  width:100%;padding:10px 14px;border:1.5px solid var(--gray-200);
  border-radius:10px;font-size:14px;font-family:var(--font);
  color:var(--gray-800);background:var(--white);outline:none;transition:all .2s;
}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light)}
textarea{resize:vertical;min-height:60px}
button{
  border:none;cursor:pointer;font-family:var(--font);font-size:14px;
  transition:all .2s;border-radius:10px;
}
.btn-primary{
  padding:10px 20px;background:var(--gradient);color:#fff;
  font-weight:600;box-shadow:var(--shadow);
}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;transform:none;cursor:not-allowed}
.btn-ghost{
  padding:8px 16px;background:var(--gray-50);color:var(--gray-600);
  font-weight:500;
}
.btn-ghost:hover{background:var(--gray-100)}
.btn-danger{
  padding:6px 12px;background:var(--red-light);color:var(--red);
  font-size:12px;font-weight:600;
}
.btn-danger:hover{background:#FED7D7}
.btn-sm{
  padding:4px 10px;font-size:12px;border-radius:8px;
  background:var(--gray-100);color:var(--gray-600);font-weight:500;
}
.btn-sm:hover{background:var(--gray-200)}
.btn-xs{padding:2px 8px;font-size:11px;border-radius:6px;font-weight:500}
.btn-ok{background:var(--green);color:#fff}
.btn-ok:hover{opacity:.85}

/* Progress bar */
.progress-bar{height:8px;background:var(--gray-100);border-radius:10px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;background:var(--gradient);border-radius:10px;transition:width .3s}

/* Streak flame */
.streak-display{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:800}
.streak-display .flame{font-size:36px}

/* News item */
.news-item{
  display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--gray-50);
  align-items:flex-start;
}
.news-item:last-child{border-bottom:none}
.news-rank{
  width:28px;height:28px;min-width:28px;border-radius:50%;
  background:var(--gray-100);color:var(--gray-500);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
}
.news-rank.top3{background:var(--gradient);color:#fff}
.news-body{flex:1;min-width:0}
.news-title{font-size:14px;font-weight:600;color:var(--blue);text-decoration:none;line-height:1.4;cursor:pointer}
.news-title:hover{text-decoration:underline;color:var(--blue-dark)}
.news-summary{font-size:12px;color:var(--gray-500);margin-top:3px;line-height:1.5}
.news-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--gray-400);margin-top:4px;flex-wrap:wrap}
.news-link{font-size:11px;color:var(--blue);text-decoration:none;font-weight:600}
.news-link:hover{text-decoration:underline}

/* Todo item */
.todo-item{
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid var(--gray-50);
}
.todo-item:last-child{border-bottom:none}
.todo-checkbox{
  width:22px;height:22px;min-width:22px;border:2px solid var(--gray-300);
  border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.todo-checkbox.checked{background:var(--green);border-color:var(--green)}
.todo-checkbox svg{display:none}
.todo-checkbox.checked svg{display:block}
.todo-text{flex:1;font-size:14px}
.todo-text.done{text-decoration:line-through;color:var(--gray-400)}
.todo-del{color:var(--gray-400);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.todo-del:hover{color:var(--red);background:var(--red-light)}

/* English practice */
.eng-scenario{
  background:var(--gray-50);border-radius:var(--radius-sm);padding:16px;
  margin-bottom:12px;border-left:4px solid var(--blue);
}
.eng-scenario .eng-scene-title{font-weight:700;margin-bottom:8px;font-size:15px}
.eng-scenario .eng-dialog-line{margin:6px 0;font-size:14px;line-height:1.7}
.eng-scenario .eng-dialog-line .role{font-weight:600;color:var(--blue)}
.eng-scenario .eng-dialog-line .phonetic{font-size:12px;color:var(--gray-400);margin-left:6px}
.eng-speak-btn{
  padding:8px 16px;background:var(--blue-light);color:var(--blue-dark);
  border-radius:20px;font-size:13px;font-weight:600;margin-top:8px;width:auto;
}
.eng-speak-btn:hover{background:var(--blue);color:#fff}
.eng-record-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.eng-input{flex:1;padding:8px 12px;font-size:14px}
.eng-feedback{padding:6px 12px;border-radius:8px;font-size:13px;margin-top:6px;font-weight:500}
.eng-feedback.good{background:var(--green-light);color:var(--green)}
.eng-feedback.fix{background:var(--orange-light);color:var(--orange)}

/* Learning card */
.learn-card{padding:20px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.learn-card .learn-theme{font-size:12px;color:var(--purple);font-weight:600;text-transform:uppercase;margin-bottom:4px}
.learn-card h3{font-size:16px;margin-bottom:12px;color:var(--gray-800)}
.learn-card .learn-section{margin-bottom:12px}
.learn-card .learn-section h4{font-size:13px;color:var(--gray-500);margin-bottom:4px;font-weight:600}
.learn-card .learn-section p{font-size:14px;line-height:1.7;color:var(--gray-700)}
.learn-card .learn-think{
  background:var(--orange-light);padding:12px 16px;border-radius:10px;
  font-size:14px;font-weight:500;color:var(--orange);margin-top:12px;
}

/* Finance transaction */
.txn-item{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--gray-50);font-size:14px;
}
.txn-item:last-child{border-bottom:none}
.txn-icon{font-size:20px}
.txn-info{flex:1}
.txn-info .txn-cat{font-size:11px;color:var(--gray-400)}
.txn-amount{font-weight:700}
.txn-amount.in{color:var(--green)}
.txn-amount.out{color:var(--red)}
.budget-bar{height:10px;background:var(--gray-100);border-radius:10px;overflow:hidden;margin:8px 0}
.budget-fill{height:100%;border-radius:10px;transition:width .3s}
.budget-fill.safe{background:var(--green)}
.budget-fill.warn{background:var(--orange)}
.budget-fill.danger{background:var(--red)}

/* Reading */
.reading-item{
  padding:14px 0;border-bottom:1px solid var(--gray-50);
}
.reading-item:last-child{border-bottom:none}
.reading-item .book-title{font-size:15px;font-weight:700}
.reading-item .book-progress{font-size:13px;color:var(--gray-500);margin:4px 0}
.reading-item .book-quotes{margin-top:8px}
.reading-item .book-quote{
  font-size:13px;color:var(--gray-600);padding:4px 0;
  border-left:3px solid var(--pink-light);padding-left:10px;margin:4px 0;
  font-style:italic;
}

/* Collect */
.collect-item{
  padding:12px 0;border-bottom:1px solid var(--gray-50);
}
.collect-item:last-child{border-bottom:none}
.collect-item .collect-title{font-size:14px;font-weight:600}
.collect-item .collect-summary{font-size:13px;color:var(--gray-500);margin:4px 0}
.collect-item .collect-meta{display:flex;gap:8px;align-items:center;margin-top:4px}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--gray-800);color:#fff;padding:10px 24px;border-radius:20px;
  font-size:14px;z-index:100;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}

/* Source indicator */
.source-indicator{font-size:11px;color:var(--gray-400)}
.source-indicator.live{color:var(--green)}
.source-indicator.error{color:var(--orange)}

.refresh-btn{
  width:28px;height:28px;border:none;background:var(--gray-100);color:var(--gray-500);
  border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;
  justify-content:center;transition:all .2s;
}
.refresh-btn:hover{background:var(--blue);color:#fff}
.refresh-btn.spinning{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Mobile */
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:100;width:260px;min-width:260px;transition:left .3s}
  .sidebar.open{left:0}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99}
  .sidebar-overlay.show{display:block}
  .mobile-header{display:flex}
  .main{padding:16px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h2>Loran 工作台</h2>
      <div class="ver">v2 · 智能助手</div>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button class="btn-sm" onclick="app.exportData()">📤 导出数据</button>
      <button class="btn-sm" onclick="app.importData()">📥 导入数据</button>
      <button class="btn-sm" onclick="app.clearAll()">🗑 清空数据</button>
    </div>
  </aside>
  <main class="main" id="mainContent">
    <div class="mobile-header">
      <h2>Loran 工作台</h2>
      <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
    </div>
    <div id="pageContent"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" style="display:none" accept=".json">

<script>
(function(){
'use strict';

const STORAGE_KEY = 'loran_workbench_v2';
const TODAY = new Date();
const TODAY_STR = TODAY.toISOString().slice(0,10);
const YESTERDAY = new Date(TODAY); YESTERDAY.setDate(YESTERDAY.getDate()-1);
const YESTERDAY_STR = YESTERDAY.toISOString().slice(0,10);
const WEEKDAYS = ['日','一','二','三','四','五','六'];

// ===== Navigation =====
const NAV_ITEMS = [
  {id:'morning', emoji:'🌅', label:'晨间汇总', shortcut:'/morning'},
  {id:'en',      emoji:'🇬🇧', label:'英语学习', shortcut:'/en'},
  {id:'learn',   emoji:'📚', label:'深度学习', shortcut:'/learn'},
  {id:'finance', emoji:'💰', label:'财务与记账', shortcut:'/finance'},
  {id:'collect', emoji:'📥', label:'内容沉淀', shortcut:'/collect'},
  {id:'read',    emoji:'📖', label:'阅读管理', shortcut:'/read'},
  {id:'todo',    emoji:'✅', label:'待办管理', shortcut:'/todo'},
];

let currentPage = 'morning';

function renderSidebar(){
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = NAV_ITEMS.map(item=>`
    <div class="nav-item${item.id===currentPage?' active':''}" data-page="${item.id}">
      <span class="nav-emoji">${item.emoji}</span>
      <span>${item.label}</span>
      <span class="nav-shortcut">${item.shortcut}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click',function(){switchPage(this.dataset.page)});
  });
}

function switchPage(page){
  currentPage = page;
  renderSidebar();
  renderPage();
  if(window.innerWidth<=768) closeSidebar();
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ===== Data =====
let appData = {};

const DEFAULT_DATA = {
  jokes:[
    '为什么数学书总是很忧郁？因为它有太多的问题。',
    '我问冰箱：你冷吗？它说：有点冷，但我不会说出来，因为我只会制冷。',
    '两个天线结婚了，他们的孩子叫什么？——小甜甜。',
    '0遇见8，说：哟，系了条腰带就胖成这样？',
    '为什么程序员总是分不清万圣节和圣诞节？因为 Oct 31 == Dec 25。',
  ],
  english:{streak:0,lastCheckIn:'',points:0,scenarios:[]},
  learn:{lastTopic:'',lastDate:''},
  finance:{budget:5000,transactions:[],funds:[
    {id:'f1',name:'沪深300ETF联接',code:'110020',nav:1.4523,change:0.0125,changePct:0.87},
    {id:'f2',name:'中证500指数增强',code:'161017',nav:2.1087,change:-0.0234,changePct:-1.10},
    {id:'f3',name:'招商中证白酒',code:'161725',nav:1.8765,change:0.0342,changePct:1.86}
  ]},
  collect:{items:[]},
  reading:{books:[]},
  todos:[],
  newsCache:{news:[],mood:'',updated:''},
};

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      appData = JSON.parse(raw);
      // Ensure all keys exist
      for(const k of Object.keys(DEFAULT_DATA)){
        if(!(k in appData)) appData[k] = JSON.parse(JSON.stringify(DEFAULT_DATA[k]));
      }
      return true;
    }
  }catch(e){}
  appData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData();
  return false;
}

function saveData(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appData))}catch(e){}
}

// ===== Utility =====
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmtDate(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'}
function fmtWeekday(d){return WEEKDAYS[d.getDay()]}
function fmtTime(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function safeHref(url){if(!url||url==='#')return '#';return url.startsWith('http://')||url.startsWith('https://')?url:'#'}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ===== Dynamic News =====
const NEWS_APIS = [
  'https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2515&k=&num=12&page=1',
  'https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2509&k=&num=12&page=1',
];

const CATEGORY_RULES = [
  {kw:['央行','降准','降息','货币政策','LPR','MLF','逆回购','社融','信贷'],cat:'finance'},
  {kw:['A股','沪指','深成指','创业板','上证','深证','北证','涨停','跌停','成交额','券商'],cat:'finance'},
  {kw:['美联储','Fed','加息','通胀','CPI','非农','美元指数','美债','美股','纳斯达克'],cat:'finance'},
  {kw:['人民币','汇率','外汇','在岸','离岸','CNY','CNH'],cat:'finance'},
  {kw:['原油','油价','OPEC','能源','天然气','布伦特','WTI'],cat:'finance'},
  {kw:['国务院','国常会','政策','发改委','财政部','商务部','外交部','两会'],cat:'politics'},
  {kw:['中美','关税','贸易战','制裁','经贸','出口管制'],cat:'politics'},
  {kw:['欧盟','碳','CBAM','欧洲'],cat:'politics'},
  {kw:['AI','人工智能','大模型','芯片','半导体','机器人','5G','6G','算力','自动驾驶'],cat:'tech'},
  {kw:['房地产','楼市','房价','购房','公积金','房贷','二手房'],cat:'tech'},
];

function categorize(title){
  const t=title.toLowerCase();
  for(const rule of CATEGORY_RULES){
    for(const k of rule.kw){if(t.includes(k.toLowerCase()))return rule.cat}
  }
  return 'finance';
}

async function fetchNews(){
  const cached = appData.newsCache||{};
  // Use cache if updated within 30 min
  if(cached.updated && (Date.now()-new Date(cached.updated).getTime())<30*60*1000 && cached.news.length){
    return;
  }
  try{
    const responses = await Promise.allSettled(NEWS_APIS.map(u=>fetch(u,{signal:AbortSignal.timeout(8000)})));
    let articles=[];
    for(const r of responses){
      if(r.status!=='fulfilled'||!r.value.ok)continue;
      try{
        const j=await r.value.json();
        if(j.result&&j.result.data){
          for(const item of j.result.data){
            const title=(item.title||'').trim();
            const url=(item.url||'').trim();
            const intro=(item.intro||item.wapsummary||'').trim();
            if(title&&url&&url.startsWith('http'))articles.push({title,url,intro,ctime:item.ctime||0});
          }
        }
      }catch(e){}
    }
    if(!articles.length)return;
    articles.sort((a,b)=>b.ctime-a.ctime);
    const seen=new Set();
    const unique=articles.filter(a=>{if(seen.has(a.url))return false;seen.add(a.url);return true});
    // Select balanced
    const cats={finance:[],politics:[],tech:[]};
    for(const a of unique){const c=categorize(a.title);if(cats[c].length<5)cats[c].push(a)}
    const selected=[],used=new Set();
    for(const c of['finance','politics','tech']){
      let n=0;
      for(const a of cats[c]){if(n>=3||selected.length>=10)break;if(!used.has(a.url)){selected.push({...a,category:c});used.add(a.url);n++}}
    }
    for(const a of unique){if(selected.length>=10)break;if(!used.has(a.url)){selected.push({...a,category:categorize(a.title)});used.add(a.url)}}
    // Map to format
    const news=selected.slice(0,10).map((a,i)=>({
      id:'n'+(i+1),title:a.title.length>45?a.title.slice(0,42)+'...':a.title,
      summary:(a.intro||a.title).slice(0,45),source:'新浪财经',link:a.url,category:a.category,rank:i+1
    }));
    const bullish=selected.filter(a=>/涨|突破|新高|利好|反弹|回暖|增长/.test(a.title)).length;
    const bearish=selected.filter(a=>/跌|下跌|回落|风险|担忧|下滑/.test(a.title)).length;
    let mood='今日市场情绪：';mood+=bullish>bearish+2?'偏暖，利好信号密集。':bearish>bullish+2?'偏谨慎，不确定性上升。':'多空交织，市场在博弈中寻找方向。';
    mood+=' (实时数据 · '+fmtTime(new Date())+')';
    appData.newsCache={news,mood,updated:new Date().toISOString()};
    saveData();
  }catch(e){console.warn('News fetch failed:',e.message)}
}

function renderCollect(){
  const items=appData.collect?.items||[];
  const cats={inspiration:{label:'💡 灵感库',items:[]},skill:{label:'🛠 技能教程',items:[]},fun:{label:'😂 搞笑解压',items:[]}};
  items.forEach(i=>{
    const key=i.category||'inspiration';
    if(cats[key])cats[key].items.push(i);
  });

  let html=`<div class="page-header"><h1>📥 内容沉淀</h1><p class="page-sub">抖音收藏整理 · 共 ${items.length} 条</p></div>`;

  // Add form
  html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">➕ 添加收藏</span></div><div class="module-card-body">`;
  html+=`<input id="collectTitle" placeholder="视频标题/描述" style="margin-bottom:8px">`;
  html+=`<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
    <select id="collectCat" style="flex:1"><option value="inspiration">💡 灵感库</option><option value="skill">🛠 技能教程</option><option value="fun">😂 搞笑解压</option></select>
    <input id="collectUrl" placeholder="链接（可选）" style="flex:2">
  </div>`;
  html+=`<textarea id="collectSummary" placeholder="精华摘要（200字以内）" maxlength="200" style="margin-bottom:8px"></textarea>`;
  html+=`<button class="btn-primary" onclick="app.addCollect()" style="width:100%">保存</button>`;
  html+=`</div></div>`;

  // Items by category
  for(const [key,cat] of Object.entries(cats)){
    html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">${cat.label}</span><span class="badge purple">${cat.items.length} 条</span></div><div class="module-card-body">`;
    if(!cat.items.length){
      html+=`<div class="empty-state"><p>暂无内容</p></div>`;
    }else{
      cat.items.reverse().forEach(i=>{
        html+=`<div class="collect-item"><div class="collect-title">${esc(i.title||'未命名')}</div>`;
        if(i.summary)html+=`<div class="collect-summary">${esc(i.summary)}</div>`;
        html+=`<div class="collect-meta"><span style="font-size:12px;color:var(--gray-400)">${i.date?.slice(0,10)||''}</span>`;
        if(i.url)html+=`<a href="${esc(safeHref(i.url))}" target="_blank" class="news-link">查看链接↗</a>`;
        html+=`<button class="btn-xs btn-danger" onclick="app.removeCollect('${i.id}')">删除</button></div></div>`;
      });
    }
    html+=`</div></div>`;
  }
  return html;
}

// ===== Reading Page =====
function renderReading(){
  const books=appData.reading?.books||[];
  let html=`<div class="page-header"><h1>📖 阅读管理</h1><p class="page-sub">当前在读：${books.filter(b=>!b.done).length} 本</p></div>`;

  // Add book
  html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">➕ 添加在读</span></div><div class="module-card-body">`;
  html+=`<div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
    <input id="bookTitle" placeholder="书名" style="flex:2;min-width:120px">
    <input id="bookProgress" placeholder="当前进度（如：P156 / 第5章）" style="flex:2;min-width:150px">
    <input id="bookTotal" placeholder="总页码/章节" style="flex:1;min-width:80px">
  </div>`;
  html+=`<textarea id="bookQuotes" placeholder="3个关键金句（每行一句，用换行分隔）" style="margin-bottom:8px"></textarea>`;
  html+=`<button class="btn-primary" onclick="app.addBook()" style="width:100%">保存</button>`;
  html+=`</div></div>`;

  // Book list
  books.forEach(b=>{
    if(b.done)return;
    html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">📘 ${esc(b.title)}</span><button class="btn-xs btn-ok" onclick="app.markBookDone('${b.id}')">读完</button></div><div class="module-card-body">`;
    html+=`<div class="book-progress">📌 进度：${esc(b.progress)} / ${esc(b.total||'—')}</div>`;
    if(b.quotes&&b.quotes.length){
      html+=`<div class="book-quotes"><div style="font-size:12px;color:var(--gray-400);margin-bottom:4px">📝 关键金句回顾：</div>`;
      b.quotes.forEach(q=>{html+=`<div class="book-quote">"${esc(q)}"</div>`});
      html+=`</div>`;
    }
    html+=`<div style="margin-top:8px"><input id="updateProgress${b.id}" placeholder="更新进度..." style="width:auto;display:inline;flex:1;margin-right:8px"><button class="btn-ghost" onclick="app.updateBookProgress('${b.id}')">更新</button></div>`;
    html+=`</div></div>`;
  });

  // Completed books
  const doneBooks=books.filter(b=>b.done);
  if(doneBooks.length){
    html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">✅ 已读完</span></div><div class="module-card-body">`;
    doneBooks.forEach(b=>{html+=`<div style="padding:8px 0;font-size:14px">✅ ${esc(b.title)} · ${esc(b.total||'—')}</div>`});
    html+=`</div></div>`;
  }

  if(!books.length){
    html+=`<div class="module-card"><div class="module-card-body"><div class="empty-state"><p>📚 开始添加你的第一本书吧</p></div></div></div>`;
  }
  return html;
}

// ===== Todo Page =====
function renderTodo(){
  const todos=appData.todos||[];
  const pending=todos.filter(t=>!t.done);
  const done=todos.filter(t=>t.done);

  let html=`<div class="page-header"><h1>✅ 待办管理</h1><p class="page-sub">${pending.length} 项待处理 · ${done.length} 项已完成</p></div>`;

  // Add todo
  html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">➕ 新增待办</span></div><div class="module-card-body">`;
  html+=`<div style="display:flex;gap:8px"><input id="todoInput" placeholder="输入待办事项..." style="flex:1"><button class="btn-primary" onclick="app.addTodo()">添加</button></div>`;
  html+=`</div></div>`;

  // Pending
  html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">📋 待处理</span><span class="badge orange">${pending.length}</span></div><div class="module-card-body">`;
  if(!pending.length)html+=`<div class="empty-state"><p>🎉 全部完成！</p></div>`;
  else pending.forEach(t=>{
    html+=`<div class="todo-item"><div class="todo-checkbox${t.done?' checked':''}" onclick="app.toggleTodo('${t.id}')">${t.done?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>':''}</div><span class="todo-text${t.done?' done':''}">${esc(t.text)}</span><span class="todo-del" onclick="app.removeTodo('${t.id}')">×</span></div>`;
  });
  html+=`</div></div>`;

  // Done
  if(done.length){
    html+=`<div class="module-card"><div class="module-card-header"><span class="module-card-title">✅ 已完成</span><span class="badge green">${done.length}</span></div><div class="module-card-body">`;
    done.slice(-5).reverse().forEach(t=>{
      html+=`<div class="todo-item"><div class="todo-checkbox checked" onclick="app.toggleTodo('${t.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></div><span class="todo-text done">${esc(t.text)}</span><span class="todo-del" onclick="app.removeTodo('${t.id}')">×</span></div>`;
    });
    html+=`</div></div>`;
  }
  return html;
}

// ===== Render Page =====
function renderPage(){
  const el=document.getElementById('pageContent');
  switch(currentPage){
    case 'morning':el.innerHTML=renderMorning();break;
    case 'en':el.innerHTML=renderEnglish();break;
    case 'learn':el.innerHTML=renderLearn();break;
    case 'finance':el.innerHTML=renderFinance();break;
    case 'collect':el.innerHTML=renderCollect();break;
    case 'read':el.innerHTML=renderReading();break;
    case 'todo':el.innerHTML=renderTodo();break;
  }
  bindPageEvents();
}

function bindPageEvents(){
  // English check-in
  const btnCheckIn=document.getElementById('btnCheckIn');
  if(btnCheckIn)btnCheckIn.onclick=()=>{if(!appData.english)appData.english={streak:0,lastCheckIn:'',points:0,scenarios:[]};const eng=appData.english;if(eng.lastCheckIn===TODAY_STR)return;if(eng.lastCheckIn!==YESTERDAY_STR)eng.streak=0;eng.streak=(eng.streak||0)+1;eng.lastCheckIn=TODAY_STR;eng.points=(eng.points||0)+10;saveData();renderPage();toast('🔥 打卡成功！+10分')};
  // Refresh button in morning
  const refreshBtn=document.querySelector('.refresh-btn');
  if(refreshBtn)refreshBtn.onclick=()=>app.refreshNews();
}

// ===== App Methods =====
window.app = {
  switchPage(page){switchPage(page);},
  exportData(){
    const json=JSON.stringify(appData,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='loran_workbench_'+TODAY_STR+'.json';a.click();
    URL.revokeObjectURL(a.href);toast('📤 数据已导出');
  },
  importData(){
    const input=document.getElementById('importFileInput');
    input.click();
    input.onchange=function(e){
      const file=e.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=function(ev){
        try{
          const data=JSON.parse(ev.target.result);
          appData=data;saveData();renderPage();toast('📥 数据已导入');
        }catch(ex){toast('❌ 文件格式错误')}
      };
      reader.readAsText(file);
      e.target.value='';
    };
  },
  clearAll(){
    if(confirm('确定要清空所有数据吗？此操作不可撤销！')){
      appData=JSON.parse(JSON.stringify(DEFAULT_DATA));
      localStorage.removeItem(STORAGE_KEY);
      renderPage();
      toast('🗑 数据已清空');
    }
  },
  randomJoke(){
    if(appData.jokes&&appData.jokes.length){
      const joke=appData.jokes[Math.floor(Math.random()*appData.jokes.length)];
      document.getElementById('dailyJoke').textContent=joke;
      saveData();
    }
  },
  refreshNews(){
    const btn=document.querySelector('.refresh-btn');
    if(btn)btn.classList.add('spinning');
    fetchNews().then(()=>{
      if(btn)btn.classList.remove('spinning');
      if(currentPage==='morning')renderPage();
    });
  },
  // English
  speakEnglish(si){
    const s=(appData.english?.scenarios||[])[si];
    if(!s)return;
    const text=s.lines.map(l=>l.en).join('. ');
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const utter=new SpeechSynthesisUtterance(text);
      utter.lang='en-US';utter.rate=0.85;
      window.speechSynthesis.speak(utter);
    }
    toast('🔊 正在播放...');
  },
  practiceEnglish(si){
    const input=document.getElementById('engInput'+si);
    const fb=document.getElementById('engFeedback'+si);
    if(!input||!fb||!input.value.trim()){toast('请先输入跟读内容');return;}
    const userText=input.value.trim();
    const scenario=appData.english?.scenarios?.[si];
    if(!scenario)return;
    const target=scenario.lines.filter(l=>l.role==='You').map(l=>l.en.toLowerCase()).join(' ');
    const userLower=userText.toLowerCase();
    const similarity=target.split(' ').filter(w=>userLower.includes(w)).length/Math.max(1,target.split(' ').length);
    if(similarity>=0.7){
      fb.innerHTML='<div class="eng-feedback good">✅ 不错！匹配度 '+(similarity*100).toFixed(0)+'%，继续加油！</div>';
      appData.english.points=(appData.english.points||0)+3;saveData();
    }else{
      fb.innerHTML='<div class="eng-feedback fix">🔄 可以改进（匹配度 '+(similarity*100).toFixed(0)+'%），请参考上面的音标再试一次</div>';
    }
    input.value='';
  },
  // Finance
  addTransaction(){
    const amount=parseFloat(document.getElementById('txnAmount')?.value);
    const note=document.getElementById('txnNote')?.value||'';
    const cat=document.getElementById('txnCat')?.value||'其他';
    const type=document.getElementById('txnType')?.value||'expense';
    if(!amount||amount<=0){toast('请输入有效金额');return;}
    if(!appData.finance)appData.finance={budget:5000,transactions:[],funds:DEFAULT_DATA.finance.funds};
    appData.finance.transactions.push({id:'t'+Date.now(),date:TODAY_STR,amount,note,cat,type});
    saveData();renderPage();toast('✅ 已记录');
  },
  // Collect
  addCollect(){
    const title=document.getElementById('collectTitle')?.value||'';
    const cat=document.getElementById('collectCat')?.value||'inspiration';
    const url=document.getElementById('collectUrl')?.value||'';
    const summary=document.getElementById('collectSummary')?.value||'';
    if(!title.trim()){toast('请输入标题');return;}
    if(!appData.collect)appData.collect={items:[]};
    appData.collect.items.push({id:'c'+Date.now(),title,summary,category:cat,url,date:TODAY_STR});
    saveData();renderPage();toast('✅ 已保存');
  },
  removeCollect(id){
    if(!appData.collect)return;
    appData.collect.items=appData.collect.items.filter(i=>i.id!==id);
    saveData();renderPage();
  },
  // Reading
  addBook(){
    const title=document.getElementById('bookTitle')?.value||'';
    const progress=document.getElementById('bookProgress')?.value||'';
    const total=document.getElementById('bookTotal')?.value||'';
    const quotesText=document.getElementById('bookQuotes')?.value||'';
    if(!title.trim()){toast('请输入书名');return;}
    const quotes=quotesText.split('\n').map(q=>q.trim()).filter(q=>q);
    if(!appData.reading)appData.reading={books:[]};
    appData.reading.books.push({id:'b'+Date.now(),title,progress,total,quotes,done:false,added:TODAY_STR});
    saveData();renderPage();toast('✅ 已添加');
  },
  markBookDone(id){
    const book=(appData.reading?.books||[]).find(b=>b.id===id);
    if(book){book.done=true;saveData();renderPage();toast('📚 恭喜读完！')}
  },
  updateBookProgress(id){
    const input=document.getElementById('updateProgress'+id);
    if(!input||!input.value.trim())return;
    const book=(appData.reading?.books||[]).find(b=>b.id===id);
    if(book){book.progress=input.value.trim();saveData();renderPage();toast('📌 进度已更新')}
  },
  // Todo
  addTodo(){
    const input=document.getElementById('todoInput');
    if(!input||!input.value.trim()){toast('请输入待办内容');return;}
    if(!appData.todos)appData.todos=[];
    appData.todos.push({id:'td'+Date.now(),text:input.value.trim(),done:false,created:TODAY_STR});
    saveData();
    input.value='';
    renderPage();
    toast('✅ 已添加');
  },
  toggleTodo(id){
    const todo=(appData.todos||[]).find(t=>t.id===id);
    if(todo){todo.done=!todo.done;saveData();renderPage()}
  },
  removeTodo(id){
    appData.todos=(appData.todos||[]).filter(t=>t.id!==id);
    saveData();renderPage();
  }
};

// ===== Init =====
function init(){
  loadData();
  renderSidebar();
  renderPage();

  // Mobile menu
  document.getElementById('mobileMenuBtn').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('show');
  });
  document.getElementById('sidebarOverlay').addEventListener('click',closeSidebar);
  document.getElementById('mainContent').addEventListener('click',function(e){
    if(window.innerWidth<=768&&!e.target.closest('.mobile-header'))closeSidebar();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
    const map={'1':'morning','2':'en','3':'learn','4':'finance','5':'collect','6':'read','7':'todo'};
    if(map[e.key]){e.preventDefault();switchPage(map[e.key]);}
  });

  // Fetch news on load
  fetchNews().then(()=>{if(currentPage==='morning')renderPage()});
  // Auto refresh news every 30 min
  setInterval(()=>{fetchNews().then(()=>{if(currentPage==='morning')renderPage()})},30*60*1000);
}

document.addEventListener('DOMContentLoaded',init);
})();
</script>
